services:
  - type: web
    name: appmodeloripios
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SQLSERVER_HOST
        value: 149.50.136.234
      - key: SQLSERVER_DB
        value: inventar_SpcHidr
      - key: SQLSERVER_USER
        value: sa
      - key: SQLSERVER_PASSWORD
        sync: false
      - key: SQLSERVER_DRIVER
        value: "ODBC Driver 18 for SQL Server"
