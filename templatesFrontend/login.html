<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  :root {
    --bg: linear-gradient(135deg, #f3f4f6, #dbeafe);
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

body {
  font-family: system-ui, sans-serif;
  background: url("{{ url_for('static', filename='minera.webp') }}")  center/cover no-repeat fixed;
  height: 100vh;
  margin: 0;

  /* Centrado del card */
  display: flex;
  justify-content: center;
  align-items: center;

  /* 🔹 Capa translúcida sobre la imagen */
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.4); /* capa blanca translúcida */
  backdrop-filter: blur(3px); /* desenfoque moderno */
}

.card {
  position: relative; /* importante para que esté encima del blur */
  z-index: 1;
  background: rgba(255, 255, 255, 0.85);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 2rem;
}
  h2 {
    text-align: center;
    color: #111827;
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }
  
  h3 {
    text-align: center;
    color: #374151;
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
  }

  p {
    text-align: center;
    color: #6b7280;
    margin-bottom: 2rem;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #374151;
    margin-bottom: 0.3rem;
  }

  input {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
  }

  button {
    width: 100%;
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 1rem;
    transition: background-color 0.2s, transform 0.1s;
  }

  button:hover {
    background-color: var(--primary-hover);
  }

  button:active {
    transform: scale(0.98);
  }

  .icon {
    width: 20px;
    height: 20px;
    vertical-align: middle;
    margin-right: 6px;
    stroke: #2563eb;
  }

  .message {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>
      <svg class="icon" fill="none" stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 3H9a2 2 0 0 0-2 2v16l5-2 5 2V5a2 2 0 0 0-2-2z"/>
      </svg>
      Iniciar Sesión
    </h2>
    <h3>Capacitaciones Simplex</h3>
    <p>Accede al dashboard con tus credenciales</p>
    <form id="loginForm" method="POST" action="/auth/login">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="" required>

      <button type="submit">
        <svg class="icon" fill="none" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 3H9a2 2 0 0 0-2 2v16l5-2 5 2V5a2 2 0 0 0-2-2z"/>
        </svg>
        Ingresar
      </button>
    </form>
    {% if request.args.get('error') %}
    <div class="message" style="color:#dc2626">❌ Usuario o contraseña incorrectos</div>
    {% endif %}
  </div>
  <!-- ponytail: POST nativo del form, sin fetch. El server ya redirige. -->
</body>
</html>
